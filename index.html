  <style>
    :root {
      --bg: #0a0e14;
      --bg2: #121a24;
      --card: #1a2332;
      --text: #f5f7fa;
      --muted: #9aa8b8;
      --accent: #00e676;
      --accent-dim: rgba(0, 230, 118, 0.12);
      --border: rgba(255, 255, 255, 0.1);
      --shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: radial-gradient(ellipse 120% 80% at 50% -20%, rgba(0, 230, 118, 0.08), transparent),
        var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      padding: 32px 6px 48px;
    }
    .wrap {
      max-width: min(100%, 1584px);
      margin: 0 auto;
      padding: 0 4px;
    }
    .site-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 4px;
    }
    .site-header h1 {
      font-size: 1.95rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0;
      background: linear-gradient(135deg, var(--text) 0%, var(--accent) 120%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .site-header .brand-line {
      width: 48px;
      height: 3px;
      background: var(--accent);
      border-radius: 999px;
      margin: 14px auto 0;
    }
    .disclaimer {
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.55;
      max-width: 42em;
      margin: 0 auto 28px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.2);
    }
    .disclaimer strong {
      color: #ffb74d;
      font-weight: 700;
    }
    .member-list {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 17px;
      align-items: stretch;
    }
    .card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: linear-gradient(165deg, var(--card) 0%, var(--bg2) 100%);
      border: 1px solid var(--border);
      border-radius: 17px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(0, 230, 118, 0.35);
    }
    .avatar-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--bg2);
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
    .avatar-placeholder {
      background: linear-gradient(180deg, var(--accent-dim), var(--bg2));
    }
    .card-body {
      padding: 14px 14px 17px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .streamer-name {
      font-size: clamp(0.98rem, 1.32vw, 1.2rem);
      font-weight: 800;
      margin: 0 0 7px;
      line-height: 1.25;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.45);
    }
    .meta {
      color: var(--muted);
      font-size: 0.86rem;
      margin: 0 0 12px;
      line-height: 1.35;
    }
    .btn {
      display: block;
      width: 100%;
      margin-top: auto;
      padding: 12px 10px;
      background: var(--accent);
      color: #0a0e14;
      text-decoration: none;
      font-weight: 800;
      border-radius: 10px;
      font-size: 0.94rem;
      text-align: center;
      transition: filter 0.15s ease;
    }
    .btn:hover { filter: brightness(1.08); }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 32px 16px;
      grid-column: 1 / -1;
    }
    @media (max-width: 960px) {
      .member-list {
        grid-template-columns: repeat(5, minmax(148px, 1fr));
        overflow-x: auto;
        padding-bottom: 8px;
        scroll-snap-type: x proximity;
      }
      .card { scroll-snap-align: start; }
    }
  </style>
</head>
